services:
  web:
    build: .
    command: >
      sh -c "poetry run python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env 

  db:
    image: postgres:16
    container_name: lacrei_saude_db
    volumes:
      - pg_data:/var/lib/postgresql/data/ 
    env_file:
      - .env 
    ports:
      - "5432:5432" 
    restart: unless-stopped
    healthcheck: 
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  pg_data: 